spring.application.name=InventoryMgtSystem
spring.config.import=optional:file:.env.local[.properties],optional:file:Backend/.env.local[.properties]
server.port=${SERVER_PORT:5050}

#MYSQL CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# FILE UPLOADS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# STORAGE
smartinventory.storage.provider=${SMARTINVENTORY_STORAGE_PROVIDER:cloudinary}
smartinventory.storage.local-path=${SMARTINVENTORY_STORAGE_LOCAL_PATH:uploads}
smartinventory.storage.public-url=${SMARTINVENTORY_STORAGE_PUBLIC_URL:http://localhost:5050/uploads}

# CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT
secreteJwtString=${JWT_SECRET}

# INTERNATIONALIZATION
spring.messages.encoding=UTF-8

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
